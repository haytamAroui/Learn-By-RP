name: Verify

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Scene content validation
        run: npm run validate:scenes

      - name: Unit and design tests
        run: npm test

      - name: Web export
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: 390x844 mobile smoke
        run: npx playwright test e2e/mobile-v3-smoke.spec.ts --project=light
