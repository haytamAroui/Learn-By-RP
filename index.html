    <script>
      (function() {
        try {
          // If window.fetch already has only a getter, add a no-op setter so assignments do not throw
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: desc.get,
                set: function() {},
                configurable: true,
                enumerable: desc.enumerable
              });
            } catch (_) {}
          }

          // Intercept future Object.defineProperty calls on window.fetch (e.g. iframe runners)
          // ensuring any getter-only definition includes a setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
          var origDefine = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || obj === globalThis) && prop === 'fetch') {
              if (descriptor && descriptor.get && !descriptor.set) {
                descriptor.set = function() {};
                descriptor.configurable = true;
              }
            }
            return origDefine.call(Object, obj, prop, descriptor);
          };
        } catch (e) {}
      })();
    </script>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
